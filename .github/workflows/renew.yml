name: Auto Renew Bot-hosting

on:
  schedule:
    # 每 2 天一次：UTC 00:52 = 北京时间 08:52（day-of-month 取奇数日 1/3/5/.../31）
    - cron: '52 0 */2 * *'
  workflow_dispatch:

# ── 为什么改成「每 2 天一次」（2026-11-05 定） ──
# 1) 消除空跑：间隔 48 小时 ≫ 24 小时冷却期，起跑时冷却必然早已结束，
#    每次都走「直接续期」路径，不会再出现「未到续期时间」的空跑与误报。
# 2) 算力减半：GitHub 曾以「fork 浪费算力」为由整体关停本仓库的 Actions
#    （2026-11-05 实发），双触发时期消耗是其他 fork 的两倍以上。
#    单次 + 隔天后，消耗回落到与上游默认同一量级甚至更低。
# 3) 到期日不倒退：每次续期是「到期日重置为今天 +4 天」，隔天续一次，
#    到期日始终在 +2 ~ +4 天之间，不会掉线。
#
# 代价（必须知道）：容错次数从「3 次」降到「1 次」。
#   隔天跑步长 = 2 天，缓冲 = 4 天，所以只有两次机会：第 2 天、第 4 天。
#   第二次机会正好落在到期日当天。若第一次丢点，必须在第 4 天补上，否则掉线。
#   故：一旦发现 Actions 连续丢点，立刻手动 Run 一次，不要等。

# 定时触发与手动 Run 可能重叠，强制串行：后到的排队等前一个结束，绝不并发操作同一账号。
# 排队期间不启动 job，不消耗 runner 分钟数。
concurrency:
  group: renew-bothosting
  cancel-in-progress: false

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    # 只跑一次、不等待，正常流程约 8~12 分钟（装依赖 5 分 + 脚本 3~6 分）。
    # 30 分钟足够覆盖偶发的 Turnstile 重试与网络抖动，也避免僵尸 run 长时间占位。
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # ── 只跑一次：不等待、不重试 ──
      # 触发间隔已改为每 2 天一次，48 小时 ≫ 24 小时冷却期，
      # 起跑时冷却必然早已结束，不会再有「未到续期时间」的空跑。
      # 故彻底删掉「等待到点后重跑」的循环：少一处逻辑、少一份算力、少一个出错点。
      # （等待上限 / MAX_ATTEMPTS 相关参数随之全部移除。）
      #
      # 关于「防重复续期」：不用 guard 查历史 run 记录。
      #   conclusion 不可靠 —— app.py 的失败路径几乎全是 exit 0，conclusion 恒为 success；
      #   且被跳过的 run 也记 success，会「跳过一次就永远连锁跳过」。曾试过，已砍。
      #   交给 app.py 自带的「未到续期时间」判断天然防重复：若已续过，跑起来会看到倒计时，
      #   判定未到时间直接退出，绝不会重复点。
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set +e
          xvfb-run --auto-servernum python3 -u app.py 2>&1 | tee renew_run.log
          set -e

          # ① 前序刚续过（倒计时 23~24 小时）→ 静默收工，不发通知也不标失败
          if grep -q "前序已续期完成" renew_run.log; then
            echo "✅ 前序已完成续期（倒计时 23~24 小时），本次无需操作，收工"
            exit 0
          fi

          # ② 本次续期成功
          if grep -q "续期成功" renew_run.log; then
            echo "✅ 续期成功，收工"
            exit 0
          fi

          # ③ 冷却期未到 → 空跑。每 2 天一次的前提下极少发生（仅月末 31→1 边界可能出现）
          if grep -q "未到续期时间" renew_run.log; then
            echo "⏳ 未到续期时间，本次空跑，不重复操作"
            exit 0
          fi

          # ④ 其余全部视为异常：登录失败 / Turnstile 未过 / 结果未知。
          #    标红（exit 1）让 Actions 页面一眼可见，便于及时手动介入。
          echo "❌ 未匹配到已知状态，本次标记为失败"
          exit 1

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log renew_run.log

      # ─────────────────────────────────────────────────────────────
      # 清理历史运行记录：只保留最近 3 天（UTC）的记录，更早的全部删除。
      #
      # 为什么是 3 天：单次触发下每天只有 1 条记录，留 3 条便于回溯「昨天、
      #   前天到底跑没跑、成没成」。留太多没必要，GitHub 也会积压。
      #
      # 注意：删掉的历史无法找回。若需更长回溯，把 KEEP_DAYS 调大即可。
      - name: 🧹 清理历史运行记录（保留最近 3 天）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP_DAYS=3
          if [ "$KEEP_DAYS" -le 1 ]; then
            since=$(date -u +%Y-%m-%d)
          else
            since=$(date -u -d "$((KEEP_DAYS - 1)) days ago" +%Y-%m-%d)
          fi
          echo "保留 $since 及之后的记录，删除更早的"
          ids=$(gh run list -R "${{ github.repository }}" --workflow=renew.yml \
                  --limit=100 --json databaseId,createdAt \
                  --jq ".[] | select(.createdAt < \"$since\") | .databaseId" \
                  2>/dev/null) || ids=""
          if [ -z "$ids" ]; then
            echo "没有需要删除的历史记录"
            exit 0
          fi
          for id in $ids; do
            echo "删除运行记录: $id"
            gh run delete "$id" -R "${{ github.repository }}" || true
          done
      # ─────────────────────────────────────────────────────────────
