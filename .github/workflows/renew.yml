name: Auto Renew Bot-hosting

on:
  schedule:
    # 每天一次：UTC 00:52 = 北京时间 08:52
    - cron: '52 0 * * *'
  workflow_dispatch:

# ── 为什么只留一次触发 ──
# GitHub 曾以「fork 仓库浪费算力」为由，把整个 Actions 关停（2026-11-05 实发）。
# 双触发每天跑两遍、且兜底经常空跑 8 分钟，是直接的诱因。
# 故回落为单次触发：每天一次，成功即收工，失败就等第二天。
# 代价：失去「主触发丢点时兜底补位」的能力 —— 单次没跑起来，当天就没人干了。
#       可接受，因为每次续期是「到期日重置为今天 +4 天」，有 3 天缓冲，偶发一天失手不致命。

# 定时触发与手动 Run 可能重叠，强制串行：后到的排队等前一个结束，绝不并发操作同一账号。
# 排队期间不启动 job，不消耗 runner 分钟数。
concurrency:
  group: renew-bothosting
  cancel-in-progress: false

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    # 单次触发后不再有第二次机会，等待上限要放宽到 90 分钟，
    # 故超时上限相应提到 150 分钟（装依赖约 5 分钟 + 等待 90 分钟 + 重跑 5 分钟，留足余量）。
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # ── 核心：自锚定等待 ──
      # 若未到续期时间且倒计时 ≤ 90 分钟，就原地等到冷却结束再续期。
      # 效果：一旦某天续期落在时刻 X，之后每天都会「等到 X 再续」，锚点钉死、永不漂移。
      #
      # 为什么上限是 90 分钟（原来是 60）：只有一次触发机会了，等不到就是当天失败。
      #   起跑时刻 = cron 时刻 + GitHub 调度延迟（实测 0~48 分钟，个别天数达 5 小时）。
      #   续期锚点通常落在起跑时刻之后 20~50 分钟，90 分钟足以覆盖延迟 ≤ 60 分钟的正常日子。
      #   延迟超过 90 分钟的日子会空跑，等第二天 —— 这是单触发模式的固有代价。
      #
      # 关于「防重复续期」：这里刻意不用 guard 查历史 run 记录。
      #   曾尝试加 guard 查「今日是否已有 success run」来跳过，但它的判断依据
      #   （run 的 conclusion）根本不可靠 ——
      #     ① app.py 的失败路径几乎全是 exit 0，conclusion 恒为 success，真假续期无法区分，
      #        会误判为「已成功」而不补；
      #     ② 被 guard 跳过的 run 其 conclusion 也是 success，会「跳过一次就永远连锁跳过」。
      #   要修对只能逐条下载 run 日志 grep「续期成功」，复杂度与失败风险远超收益。
      #   故砍掉 guard，交给 app.py 自带的「未到续期时间」判断天然防重复：
      #   若今天已续过，本次跑起来会看到倒计时，app.py 判定未到时间、空跑退出，绝不会重复点。
      - name: 🚀 运行续期脚本（含自锚定等待）
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MAX_ATTEMPTS=2       # 首次 + 等待后重跑一次
          MAX_WAIT_MIN=90      # 单次最多原地等待 90 分钟（单触发模式下放宽）
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "========== 第 $i / $MAX_ATTEMPTS 次尝试 =========="
            set +e
            xvfb-run --auto-servernum python3 -u app.py 2>&1 | tee renew_run.log
            set -e

            # 前序已续期完成（倒计时 23~24 小时）→ 说明主触发刚成功过，
            # 本次是兜底，没必要再动手，也不该标失败。静默收工。
            if grep -q "前序已续期完成" renew_run.log; then
              echo "✅ 前序已完成续期（倒计时 23~24 小时），本次无需操作，收工"
              exit 0
            fi

            if grep -q "续期成功" renew_run.log; then
              echo "✅ 第 $i 次尝试：续期成功，收工"
              exit 0
            fi

            if grep -q "未到续期时间" renew_run.log; then
              cd_txt=$(grep -o '倒计时: [0-9][0-9]:[0-9][0-9]:[0-9][0-9]' renew_run.log | head -1 | awk '{print $2}')
              if [ -n "$cd_txt" ]; then
                h=$(echo "$cd_txt" | cut -d: -f1)
                m=$(echo "$cd_txt" | cut -d: -f2)
                s=$(echo "$cd_txt" | cut -d: -f3)
                secs=$(( 10#$h * 3600 + 10#$m * 60 + 10#$s ))
              else
                secs=999999
              fi
              echo "⏳ 距可续期还有 ${secs} 秒"

              if [ "$secs" -le $(( MAX_WAIT_MIN * 60 )) ] && [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                wait_s=$(( secs + 90 ))
                echo "🕐 等待 ${wait_s} 秒（倒计时归零 + 90 秒缓冲）后重跑..."
                sleep "$wait_s"
                continue
              fi
              echo "⏳ 剩余时间超过等待上限 —— 本次空跑（今天已续过 / 冷却期未到），锚点不动"
              exit 0
            fi

            # 既没「续期成功」也没「未到续期时间」= 登录失败 / Turnstile 未过 / 结果未知。
            # 标记为失败（exit 1）让这次 run 在 Actions 页面显示红色，便于一眼识别、及时介入。
            echo "❌ 未匹配到已知状态，本次标记为失败"
            exit 1
          done
          # 循环内所有分支都会 exit，正常到不了这里；兜底保险
          exit 1

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log renew_run.log

      # ─────────────────────────────────────────────────────────────
      # 清理历史运行记录：只保留最近 3 天（UTC）的记录，更早的全部删除。
      #
      # 为什么是 3 天：单次触发下每天只有 1 条记录，留 3 条便于回溯「昨天、
      #   前天到底跑没跑、成没成」。留太多没必要，GitHub 也会积压。
      #
      # 注意：删掉的历史无法找回。若需更长回溯，把 KEEP_DAYS 调大即可。
      - name: 🧹 清理历史运行记录（保留最近 3 天）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP_DAYS=3
          if [ "$KEEP_DAYS" -le 1 ]; then
            since=$(date -u +%Y-%m-%d)
          else
            since=$(date -u -d "$((KEEP_DAYS - 1)) days ago" +%Y-%m-%d)
          fi
          echo "保留 $since 及之后的记录，删除更早的"
          ids=$(gh run list -R "${{ github.repository }}" --workflow=renew.yml \
                  --limit=100 --json databaseId,createdAt \
                  --jq ".[] | select(.createdAt < \"$since\") | .databaseId" \
                  2>/dev/null) || ids=""
          if [ -z "$ids" ]; then
            echo "没有需要删除的历史记录"
            exit 0
          fi
          for id in $ids; do
            echo "删除运行记录: $id"
            gh run delete "$id" -R "${{ github.repository }}" || true
          done
      # ─────────────────────────────────────────────────────────────
