name: Auto Renew Bot-hosting

on:
  schedule:
    # 主触发：UTC 00:52 = 北京时间 08:52
    - cron: '52 0 * * *'
    # 兜底触发：UTC 01:12 = 北京时间 09:12，紧贴主触发只隔 20 分钟。
    # 定位：只防 GitHub 把主触发整次丢掉，或主触发执行失败时补一次；
    #       不承担「补差几分钟」的职责 —— 那由脚本内的自锚定等待解决。
    # 为什么必须贴身：兜底若离主触发太远（比如 2 小时），一旦兜底成功，
    #       续期锚点就被拽到兜底时刻，次日主触发永远差几小时 —— 问题在兜底时间重演。
    #       贴身 20 分钟后两者运行窗口重叠，无论谁成功锚点都落在同一位置。
    - cron: '12 1 * * *'
  workflow_dispatch:

# 主触发与兜底可能重叠，强制串行：后到的排队等前一个结束，绝不并发操作同一账号。
# 排队期间不启动 job，不消耗 runner 分钟数。
concurrency:
  group: renew-bothosting
  cancel-in-progress: false

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # ── 核心：自锚定等待 ──
      # 若未到续期时间且倒计时 ≤ 60 分钟，就原地等到冷却结束再续期。
      # 60 分钟覆盖了「cron 触发 → 实际点按钮」的最大抖动（调度延迟 ≤30min + 脚本前置 ≤10min）。
      # 效果：一旦某天续期落在时刻 X，之后每天都会「等到 X 再续」，锚点钉死、永不漂移。
      #
      # 关于「防重复续期」：这里刻意不用 guard 查历史 run 记录。
      #   曾尝试加 guard 查「今日是否已有 success run」来跳过兜底，但它的判断依据
      #   （run 的 conclusion）根本不可靠 ——
      #     ① app.py 的失败路径几乎全是 exit 0，conclusion 恒为 success，真假续期无法区分，
      #        主触发失败时兜底会被误判为「已成功」而不补；
      #     ② 被 guard 跳过的 run 其 conclusion 也是 success，会「跳过一次就永远连锁跳过」。
      #   要修对只能逐条下载 run 日志 grep「续期成功」，复杂度与失败风险远超收益。
      #   故砍掉 guard，交给 app.py 自带的「未到续期时间」判断天然防重复：
      #   主触发若已成功，兜底跑起来会看到「Renew in 23:xx」，app.py 判定未到时间、空跑退出，
      #   绝不会重复点续期。代价只是兜底每天约 8 分钟空跑，值得。
      - name: 🚀 运行续期脚本（含自锚定等待）
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MAX_ATTEMPTS=2       # 等待后重跑一次即可，不需要更多
          MAX_WAIT_MIN=60      # 单次最多原地等待 60 分钟（覆盖最大起跑抖动）
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "========== 第 $i / $MAX_ATTEMPTS 次尝试 =========="
            set +e
            xvfb-run --auto-servernum python3 -u app.py 2>&1 | tee renew_run.log
            set -e

            if grep -q "续期成功" renew_run.log; then
              echo "✅ 第 $i 次尝试：续期成功，收工"
              exit 0
            fi

            if grep -q "未到续期时间" renew_run.log; then
              cd_txt=$(grep -o '倒计时: [0-9][0-9]:[0-9][0-9]:[0-9][0-9]' renew_run.log | head -1 | awk '{print $2}')
              if [ -n "$cd_txt" ]; then
                h=$(echo "$cd_txt" | cut -d: -f1)
                m=$(echo "$cd_txt" | cut -d: -f2)
                s=$(echo "$cd_txt" | cut -d: -f3)
                secs=$(( 10#$h * 3600 + 10#$m * 60 + 10#$s ))
              else
                secs=999999
              fi
              echo "⏳ 距可续期还有 ${secs} 秒"

              if [ "$secs" -le $(( MAX_WAIT_MIN * 60 )) ] && [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                wait_s=$(( secs + 90 ))
                echo "🕐 等待 ${wait_s} 秒（倒计时归零 + 90 秒缓冲）后重跑..."
                sleep "$wait_s"
                continue
              fi
              echo "⏳ 剩余时间超过等待上限 —— 本次空跑（今天已续过 / 冷却期未到），锚点不动"
              exit 0
            fi

            # 既没「续期成功」也没「未到续期时间」= 登录失败 / Turnstile 未过 / 结果未知。
            # 标记为失败（exit 1）让这次 run 在 Actions 页面显示红色，便于一眼识别、及时介入。
            echo "❌ 未匹配到已知状态，本次标记为失败"
            exit 1
          done
          # 循环内所有分支都会 exit，正常到不了这里；兜底保险
          exit 1

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log renew_run.log

      # ─────────────────────────────────────────────────────────────
      # 原「🧹 清理旧的工作流运行记录」步骤已移除。
      # 它执行 gh run delete，把除最新一次以外的运行记录全部删掉，
      # 导致 Actions 页面看不到历史、total_count 恒为 0，
      # 排查定时任务时被严重误导。运行记录由 GitHub 自动保留 90 天，无需手动清理。
      # 若你仍想保留该步骤，把下面这段取消注释、粘回 steps 末尾即可：
